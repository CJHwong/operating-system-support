[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operating-system-support"
version = "0.2.0"
description = "An AI agent that can interact with your operating system using shell commands and Python execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CJHwong", email = "CJHwong@gmail.com" },
]
keywords = ["ai", "agent", "llm", "shell", "python", "automation", "ollama", "gemini", "function-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "ollama>=0.5.3",
    "google-genai>=1.42.0",
    "pydantic-monty>=0.0.4",
]

[project.urls]
Homepage = "https://github.com/CJHwong/operating-system-support"
Repository = "https://github.com/CJHwong/operating-system-support"
Issues = "https://github.com/CJHwong/operating-system-support/issues"

[project.scripts]
oss = "oss:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "F",   # Pyflakes
    "W",   # pycodestyle warning
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
    "TID", # flake8-tidy-imports
    "PYI", # type hinting
]
ignore = [
    "F403", # unable to detect undefined names
    "F405", # may be undefined, or defined from star imports
    "E402", # module level import not at top of file
    "E501", # line too long
    "E722", # do not use bare `except`
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["oss.py"]

[tool.hatch.build.targets.sdist]
include = ["oss.py", "README.md", "pyproject.toml"]
